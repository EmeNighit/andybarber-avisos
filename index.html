return `<h2><span class="hd">Este mes</span></h2><div class="stats"><div class="panel"><b>${M.length}</b><small>clientes</small></div><div class="panel"><b>${money(gen)}</b><small>generado</small></div><div class="panel"><b>★ ${avg}</b><small>valoración</small></div></div>
<div class="panel" style="padding:10px 14px;margin-top:8px">${row("Cobrado realmente",money(rec))}${row("Gastos",money(gas))}${row("Ganancia neta",money(rec-gas))}</div>
<h2><span class="hd">Servicios más pedidos</span></h2><div class="panel" style="padding:10px 14px">${top.length?top.map(t=>row(esc(t[0]),t[1]+"×")).join(""):'<span class="empty">Sin datos todavía.</span>'}</div>
<h2><span class="hd">Historial de ingresos</span></h2><div class="panel" style="padding:10px 14px">${row("Hoy",money(cb(A.filter(r=>r.dia===hoy))))}${row("Esta semana",money(cb(A.filter(r=>r.dia>=w0&&r.dia<=w1))))}${row("Este mes",money(rec))}<hr style="border:0;border-top:1px solid var(--line)">${days.map(d=>row(lab(d),money(cb(A.filter(r=>r.dia===d))))).join("")}</div>
<h2><span class="hd">Clientes frecuentes</span></h2><div class="panel" style="padding:10px 14px">${fr.length?fr.map(f=>row(esc((C[f[0]]||{}).nombre||"Cliente"),f[1]+" visitas")).join(""):'<span class="empty">Sin datos todavía.</span>'}</div>
<h2><span class="hd">Gastos</span></h2><div class="f3" style="grid-template-columns:2fr 1fr"><input id="gd" placeholder="Compra o gasto"><input id="gm" type="number" inputmode="numeric" placeholder="RD$"></div><button class="go" style="margin-top:0" data-x="gadd">Registrar gasto</button><div class="grid" style="margin-top:10px">${X.gas.slice(-8).reverse().map(g=>`<div class="cita"><div class="top"><div>${esc(g.t)} · <b>${money(g.m)}</b><br><small>${lab(g.f)}</small></div><button class="btn" data-x="gdel" data-i="${X.gas.indexOf(g)}">Quitar</button></div></div>`).join("")}</div><div class="seg" style="margin-top:10px"><button class="opt" data-x="exx">Exportar Excel</button><button class="opt" data-x="exp">Exportar PDF</button></div><p class="mute">Tip: toca "Cobrar" en cada cita de la Agenda para registrar el dinero recibido.</p>`}
let seen=null;
function notifNew(l){const nw=seen?l.filter(x=>!seen.has(x.id)&&!x.leida):[];seen=new Set(l.map(x=>x.id));if(!nw.length)return;
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if(window.Notification&&Notification.permission==="granted")new Notification("AndyBarber",{body:nw[0].texto})}catch(e){}}
function repData(){const now=new Date(),ym=fmt(now).slice(0,7),M=R.filter(r=>r.estado==="activa"&&r.dia.slice(0,7)===ym&&when(r)<=now).sort((a,b)=>when(a)-when(b));
  return{ym,M,G:X.gas.filter(g=>g.f.slice(0,7)===ym)}}
function exXlsx(){const{ym,M,G}=repData();const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(M.map(r=>({Fecha:r.dia,Hora:r.hora,Cliente:nom(r),Servicio:r.servicio,Precio:r.precio,Cobrado:r.cobrado||0,Valoracion:r.rating||""}))),"Citas");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(G.map(g=>({Fecha:g.f,Gasto:g.t,Monto:g.m}))),"Gastos");XLSX.writeFile(wb,"andybarber-"+ym+".xlsx")}
function exPdf(){const{ym,M,G}=repData(),J=jspdf.jsPDF,d=new J(),gen=M.reduce((s,r)=>s+r.precio,0),rec=M.reduce((s,r)=>s+(r.cobrado||0),0),gas=G.reduce((s,g)=>s+g.m,0);let y=16;
  const ln=(t,b)=>{if(y>280){d.addPage();y=16}d.setFont("helvetica",b?"bold":"normal");d.text(String(t),14,y);y+=7};
  ln("AndyBarber - Reporte "+ym,1);ln("Clientes atendidos: "+M.length);ln("Generado: RD$ "+gen);ln("Cobrado: RD$ "+rec);ln("Gastos: RD$ "+gas);ln("Ganancia neta: RD$ "+(rec-gas),1);y+=4;ln("Citas",1);
  M.forEach(r=>ln(r.dia+"  "+hl(r.hora)+"  "+nom(r)+"  "+r.servicio+"  RD$ "+r.precio+(r.cobrado?" (cobrado)":"")));y+=4;ln("Gastos",1);G.forEach(g=>ln(g.f+"  "+g.t+"  RD$ "+g.m));d.save("andybarber-"+ym+".pdf")}
function vQR(){return `<h2><span class="hd">Código QR para reservar</span></h2><p class="mute">Imprímelo y pégalo en la barbería. Al escanearlo, el cliente entra directo a reservar.</p><div class="panel" style="padding:16px;display:grid;place-items:center"><div id="qr" style="background:#fff;padding:12px;border-radius:12px"></div></div><button class="go" data-x="qrdl">Descargar QR</button>`}
if(ls.get("ab_theme","d")==="l")document.body.classList.add("light");
$("gfile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(X.gal.length>=8){alert("Máximo 8 fotos en la galería.");return}
  const im=new Image,u=URL.createObjectURL(f);im.onload=async()=>{const k=Math.min(1,380/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);X.gal.push({src:c.toDataURL("image/jpeg",.6),f:Date.now()});URL.revokeObjectURL(u);await saveX();draw()};im.src=u});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset,x=D.x;
  if(b.id==="thm"){document.body.classList.toggle("light");ls.set("ab_theme",document.body.classList.contains("light")?"l":"d");return}
  if(b.id==="inst"){doInstall();return}
  if(window.Notification&&Notification.permission==="default"&&staff)Notification.requestPermission().then(p=>{if(p==="granted"&&PUSH_CFG()&&PUSHOK())pushTok(true).catch(()=>{})});
  if(!x)return;if(x!=="pdel"&&x!=="cdel")S.cx=null;
  if(x==="qrdl"){const cv=$("qr").querySelector("canvas"),a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="andybarber-qr.png";a.click()}
  if(x==="exx")exXlsx();if(x==="exp")exPdf();
  if(x==="cob"){const r=R.find(q=>q.id===D.id);if(r)await updR(r.id,{cobrado:r.cobrado!=null?null:r.precio})}
  if(x==="cdel"){if(S.cx==="c"+D.id){await delCli(D.id);S.cx=null}else S.cx="c"+D.id}
  if(x==="rmode")S.rm=D.v;
  if(x==="dia"){const c=[...cerr()],i=+D.i,k=c.indexOf(i);if(k>=0)c.splice(k,1);else c.push(i);await saveAJ({...AJ,cerrados:c})}
  if(x==="login"){const t=($("lt").value||"").replace(/\D/g,""),pw=$("lp").value;if(!live){alert("Sin conexión a la nube.");return}if(t.length<7||!pw){alert("Escribe tu teléfono y contraseña.");return}
    try{await fa.signInWithEmailAndPassword(await pEm(t),pw);location.reload();return}catch(e){alert("Teléfono o contraseña incorrectos.");return}}
  if(x==="setpw"){const pw=$("sp").value;if(pw.length<6){alert("La contraseña debe tener al menos 6 caracteres.");return}
    try{await fa.currentUser.linkWithCredential(firebase.auth.EmailAuthProvider.credential(await pEm(P.tel),pw));alert("Listo. Ya puedes entrar desde otro celular con tu teléfono y esta contraseña.")}catch(e){alert(e&&e.code==="auth/email-already-in-use"?"Ese teléfono ya tiene una contraseña creada.":"No se pudo guardar la contraseña.")}}
  if(x==="wjoin"){if(!live){alert("Sin conexión a la nube.");return}const v=S.s!==null?SV[S.s]:null;if(!v||!S.d){alert("Elige primero el servicio y el día.");return}if(wList().some(e=>e.id===uid)){alert("Ya estás en la lista de espera.");return}
    const t0=new Date(),dia=(S.d===fmt(t0)&&t0.getHours()>=19)?fmt(new Date(t0.getTime()+864e5)):S.d;
    try{await db.collection("espera").doc(uid).set({cid:uid,nombre:abv(P.nombre),tipo:S.t,servicio:v.n,precio:pr(v,S.t),dia,creada:Date.now()});S.ok="Listo, estás en la lista de espera. Si se libera un turno, el primero de la lista lo ocupa y te avisamos."}catch(e){alert("No se pudo entrar a la lista de espera. Intenta de nuevo.")}}
  if(x==="wrm"){if(S.cx==="w"+D.id){try{await db.collection("espera").doc(D.id).delete()}catch(e){alert("No se pudo quitar de la lista.")}S.cx=null}else S.cx="w"+D.id}
  if(x==="woffer")await ofrecer(R.find(q=>q.id===D.id));
  if(x==="wno")await updR(D.id,{esp:"no"});
  if(x==="pushon"){const r=await pushOn();if(r==="err")alert("No se pudieron activar los avisos. Intenta de nuevo.")}
  if(x==="reload"){location.reload();return}
  if(x==="inst2"){installHelp();return}
  if(x==="rate")await updR(D.id,{rating:+D.n});
  if(x==="fav")await saveP({...P,fav:D.v});
  if(x==="addphoto")$("gfile").click();
  if(x==="pdel"){if(S.cx==="p"+D.i){X.gal.splice(+D.i,1);S.cx=null;await saveX()}else S.cx="p"+D.i}
  if(x==="psave"){const t=$("pt").value.trim(),pc=parseInt($("pp").value);if(!t||!(pc>0&&pc<=90)){alert("Escribe el nombre y un descuento entre 1 y 90.");return}X.promo={t,pct:pc,on:true};await saveX();S.fill={pt:"",pp:""}}
  if(x==="ptog"){X.promo.on=!X.promo.on;await saveX()}
  if(x==="gadd"){const t=$("gd").value.trim(),m=parseInt($("gm").value);if(!t||!(m>0)){alert("Escribe el gasto y un monto válido.");return}X.gas.push({f:fmt(new Date()),t,m});await saveX();S.fill={gd:"",gm:""}}
  if(x==="gdel"){X.gas.splice(+D.i,1);await saveX()}
  draw()});
if(STAND())$("inst").hidden=true;

window.addEventListener("appinstalled",()=>{$("inst").hidden=true});
